name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

      # The gates run before the artifact is uploaded, so a build that ships a
      # dead link or loses the page gutter never reaches the live site.
      - name: Gate — every link and action resolves
        run: node scripts/check-links.mjs dist

      - name: Gate — layout, keyboard, contrast, reduced motion
        run: |
          npx playwright install --with-deps chromium
          npx astro preview --port 8912 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8912/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8912/ || { echo "preview server never came up"; exit 1; }
          node scripts/gate.mjs http://127.0.0.1:8912

      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
